<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A1A"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="defaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#4A5568;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#718096;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#defaultGradient)"/>
  
  <!-- Main content area -->
  <rect x="100" y="100" width="1000" height="430" fill="rgba(255,255,255,0.03)" rx="15"/>
  
  <!-- Logo/Brand area -->
  <rect x="150" y="150" width="60" height="60" fill="#FF6B35" rx="8"/>
  <text x="240" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">VONAS MEDIA</text>
  
  <!-- Main title -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">Content Creator Network</text>
  
  <!-- Subtitle -->
  <text x="150" y="340" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">Discover exclusive content and brand collaborations</text>
  
  <!-- Website URL -->
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">vonasmedia.com</text>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="900" cy="200" r="80" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="900" cy="200" r="60" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="900" cy="200" r="40" fill="none" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="150" y="460" width="900" height="3" fill="#FF6B35" rx="1.5"/>
</svg>