<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Main content area -->
  <rect x="80" y="80" width="1040" height="470" fill="rgba(255,255,255,0.05)" rx="20"/>
  
  <!-- Logo/Brand area -->
  <circle cx="200" cy="200" r="40" fill="#FF6B35"/>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">VONAS MEDIA</text>
  
  <!-- Main title -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Premium Content Creator</text>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Network & Brand Collaborations</text>
  
  <!-- Subtitle -->
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">Connect with exclusive content creators and influencers</text>
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">for authentic brand partnerships</text>
  
  <!-- Decorative elements -->
  <circle cx="1000" cy="150" r="60" fill="rgba(255,107,53,0.3)"/>
  <circle cx="1050" cy="200" r="40" fill="rgba(247,147,30,0.4)"/>
  <circle cx="950" cy="250" r="30" fill="rgba(255,210,63,0.5)"/>
  
  <!-- Bottom accent -->
  <rect x="200" y="480" width="800" height="4" fill="#FF6B35" rx="2"/>
</svg>